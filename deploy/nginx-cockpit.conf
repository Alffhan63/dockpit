# nginx site for the Docker Cockpit controller.
#
# Put the `map` block in the http context (e.g. /etc/nginx/conf.d/websocket.conf)
# if your nginx does not define $connection_upgrade already.
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cockpit.example.com;

    # Managed by certbot, or point at your own certificate.
    ssl_certificate     /etc/letsencrypt/live/cockpit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cockpit.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket: agent connections (/agent/connect) and log streams.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The controller checks the Origin against Host for browser sockets,
        # uses X-Forwarded-Proto for Secure cookies and X-Real-IP for login
        # rate limiting.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agents ping every 20s; log streams can idle much longer.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cockpit.example.com;
    return 301 https://$host$request_uri;
}
